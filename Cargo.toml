[workspace]
members = [
    "crates/newport-domain",
    "crates/newport-client",
    "crates/newport-platform",
    "crates/newport-backend",
    "crates/newport-gpui",
    "crates/newport-app",
    "crates/newport-grammars",
    "crates/newport-release",
    "crates/newport-terminal",
]
default-members = ["crates/newport-domain", "crates/newport-client", "crates/newport-platform", "crates/newport-backend", "crates/newport-gpui"]
# Linux agent and test tooling have independent dependency graphs and lockfiles.
exclude = ["tools/agent", "tools/test-harness", "tests/remote/fixture", "tests/remote/arboard-probe"]
resolver = "3"

[profile.dev]
debug = 1

# Preserve the shipping host's usable Stronghold snapshot performance.
[profile.dev.package.scrypt]
opt-level = 3

# GPUI Kit 0.8.0 plus Newport's patch series: the fork's newport/v0.8.0 branch,
# generated from its newport/patches branch. Cargo.lock pins the commit.
[patch.crates-io]
gpui-component = { git = "https://github.com/ruiyangke/gpui-kit", branch = "newport/v0.8.0" }
gpui-base = { git = "https://github.com/ruiyangke/gpui-kit", branch = "newport/v0.8.0" }
gpui-kit = { git = "https://github.com/ruiyangke/gpui-kit", branch = "newport/v0.8.0" }
gpui-kit-assets = { git = "https://github.com/ruiyangke/gpui-kit", branch = "newport/v0.8.0" }
gpui-component-macros = { git = "https://github.com/ruiyangke/gpui-kit", branch = "newport/v0.8.0" }
