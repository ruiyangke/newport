[workspace]
members = [
    "crates/newport-domain",
    "crates/newport-client",
    "crates/newport-clipboard",
    "crates/newport-win32",
    "crates/newport-platform",
    "crates/newport-backend",
    "crates/newport-gpui",
    "crates/newport-app",
    "crates/newport-grammars",
    "crates/newport-release",
    "crates/newport-terminal",
    "crates/newport-ssh",
    "crates/newport-protocol",
]
default-members = ["crates/newport-domain", "crates/newport-client", "crates/newport-platform", "crates/newport-backend", "crates/newport-gpui"]
# The Linux agent, test tooling and the private Remote apps checkout have
# independent dependency graphs and lockfiles.
exclude = ["crates/newport-agent", "tools/xtask", "tests/remote/fixture", "tests/remote/arboard-probe", "remote"]
resolver = "3"

[profile.dev]
debug = 1

# Importing profiles saved by earlier versions runs Stronghold's key derivation
# (scrypt), unusably slow unoptimized; most of its time is in Salsa20's block
# function, a crate of its own.
[profile.dev.package.scrypt]
opt-level = 3
[profile.dev.package.salsa20]
opt-level = 3

# GPUI Kit 0.8.1 plus Newport's patch series: the fork's newport/v0.8.1 branch,
# generated from its newport/patches branch. Cargo.lock pins the commit.
[patch.crates-io]
# Crates with Newport's patches, generated by `cargo xtask patched`
# (patches/patched.toml).
russh = { path = "patches/russh" }
tree-sitter-proto = { path = "patches/tree-sitter-proto" }
gpui-component = { git = "https://github.com/ruiyangke/gpui-kit", branch = "newport/v0.8.1" }
gpui-base = { git = "https://github.com/ruiyangke/gpui-kit", branch = "newport/v0.8.1" }
gpui-kit = { git = "https://github.com/ruiyangke/gpui-kit", branch = "newport/v0.8.1" }
gpui-kit-assets = { git = "https://github.com/ruiyangke/gpui-kit", branch = "newport/v0.8.1" }
gpui-component-macros = { git = "https://github.com/ruiyangke/gpui-kit", branch = "newport/v0.8.1" }
