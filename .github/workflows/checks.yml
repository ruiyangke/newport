name: Shared checks
on:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to validate and build
        required: true
        type: string
    secrets:
      NEWPORT_REMOTE_DEPLOY_KEY:
        description: Read-only deploy key for the private newport-remote repository (Remote apps)
        required: false
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
jobs:
  tooling:
    name: Release tooling and Git contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      # The pre-commit hook's check, for commits made without the hooks.
      - name: No private crates in Cargo files
        run: sh .githooks/pre-commit
      - run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            .
            tools/agent
            tools/xtask
          key: native-contracts
          save-if: ${{ github.event_name != 'pull_request' }}
      - run: sudo apt-get update && sudo apt-get install -y nsis
      - run: cargo test --locked --manifest-path tools/xtask/Cargo.toml
      - name: Replay real CLI responses through native validators
        run: cargo xtask test git-cli-contract --output target/git-contract.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: git-contract
          path: target/git-contract.json
          if-no-files-found: error
          retention-days: 7

  # Interactive launch/IME/clipboard/DPI acceptance is a separate release gate;
  # these build/test jobs do not cover it.
  native-core:
    name: Native contracts and IPC (${{ matrix.arch }})
    needs: agents
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: macos-arm64
            target: aarch64-apple-darwin
          - os: windows-2025
            arch: windows-x64
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            arch: windows-arm64
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CARGO_BUILD_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - run: rustup show
      - run: rustup target add ${{ matrix.target }}
      - name: Locate LLVM for ARM64 dependencies
        if: runner.os == 'Windows' && matrix.arch == 'windows-arm64'
        shell: pwsh
        run: |
          $llvm = 'C:\Program Files\LLVM\bin'
          if (!(Test-Path "$llvm\clang.exe")) { throw 'LLVM is required for ARM64' }
          $llvm >> $env:GITHUB_PATH
      - name: Check native source formatting
        run: cargo fmt -p newport-domain -p newport-client -p newport-platform -p newport-backend -p newport-gpui -p newport-app -p newport-grammars -p newport-release -p newport-terminal --check
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            .
            tools/xtask
          key: native-core-${{ matrix.arch }}
          save-if: ${{ github.event_name != 'pull_request' }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-agents
          path: resources/agents
      - run: cargo xtask artifact verify resources/agents
      - run: cargo clippy --locked -p newport-domain -p newport-platform -p newport-backend -p newport-client -p newport-release --features newport-platform/updates,newport-release/signing --all-targets -- -D warnings
      - run: cargo test --locked -p newport-domain -p newport-platform -p newport-backend -p newport-client -p newport-release --features newport-platform/updates,newport-release/signing
      - name: Verify SSH transport and PTY fixture
        if: runner.os == 'macOS'
        run: env -u CARGO_BUILD_TARGET cargo xtask test ssh
      - name: Verify Windows credential storage and cleanup
        if: runner.os == 'Windows'
        run: cargo test --locked -p newport-platform --lib secrets::windows::tests::credential_manager_stores_and_isolates_profile_keys -- --exact --ignored
      - name: Verify native system notification delivery
        if: runner.os == 'macOS'
        run: cargo run --locked -p newport-platform --example system_events_check

  native-ui:
    name: Native UI (${{ matrix.arch }})
    needs: agents
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: macos-arm64
            target: aarch64-apple-darwin
          - os: windows-2025
            arch: windows-x64
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            arch: windows-arm64
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CARGO_BUILD_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - run: rustup show
      - run: rustup target add ${{ matrix.target }}
      - name: Install Metal shader compiler
        if: runner.os == 'macOS'
        run: xcrun --sdk macosx metal --version || { xcodebuild -downloadComponent MetalToolchain && xcrun --sdk macosx metal --version; }
      - uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1.5.2
        if: runner.os == 'Windows' && matrix.arch == 'windows-x64'
      - name: Locate LLVM for ARM64 dependencies
        if: runner.os == 'Windows' && matrix.arch == 'windows-arm64'
        shell: pwsh
        run: |
          $llvm = 'C:\Program Files\LLVM\bin'
          if (!(Test-Path "$llvm\clang.exe")) { throw 'LLVM is required for ARM64' }
          $llvm >> $env:GITHUB_PATH
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            .
            tools/xtask
          key: native-ui-${{ matrix.arch }}
          save-if: ${{ github.event_name != 'pull_request' }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-agents
          path: resources/agents
      - run: cargo xtask artifact verify resources/agents
      - run: cargo xtask grammars
      - name: Stage Windows PDF renderer
        if: runner.os == 'Windows'
        run: cargo xtask pdfium
      - name: Prepare pinned Ghostty build dependencies
        run: cargo xtask env --github
      - run: cargo clippy --locked -p newport-domain -p newport-client -p newport-gpui -p newport-app -p newport-terminal --all-targets -- -D warnings
      - run: cargo test --locked -p newport-client -p newport-gpui -p newport-app -p newport-terminal
      - run: cargo test --locked -p newport-platform --features pdf pdf::tests
      - run: cargo build --locked -p newport-gpui -p newport-app
      - name: Verify standalone startup and profile ownership
        run: cargo test --locked -p newport-app --test standalone_lifecycle -- --ignored --skip standalone_gui --nocapture
      - name: Build native macOS app bundle
        if: runner.os == 'macOS'
        run: cargo xtask package --debug --skip-build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: runner.os == 'macOS'
        with:
          name: newport-native-${{ matrix.arch }}-adhoc-app
          path: target/${{ matrix.target }}/debug/native-package/Newport-macos.zip
          if-no-files-found: error
          retention-days: 7
      - name: Verify native Windows executable identity
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $product = Get-Content resources/app.json -Raw | ConvertFrom-Json
          $binary = Join-Path (Join-Path target $env:CARGO_BUILD_TARGET) 'debug/newport.exe'
          $info = [System.Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path $binary).Path)
          if ($info.ProductName -ne $product.productName -or
              $info.FileDescription -ne $product.productName -or
              $info.ProductVersion -ne $product.version -or
              $info.FileVersion -ne $product.version -or
              $info.OriginalFilename -ne 'newport.exe') {
            throw 'Native executable resources do not match the release identity'
          }
      - name: Locate native Windows installer compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $nsis = 'C:\Program Files (x86)\NSIS'
          if (!(Test-Path "$nsis\makensis.exe")) {
            choco install nsis --version=3.11 --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed' }
          }
          if (!(Test-Path "$nsis\makensis.exe")) { throw 'NSIS compiler not found' }
          $nsis >> $env:GITHUB_PATH
      - name: Build native Windows installer candidate
        if: runner.os == 'Windows'
        run: cargo xtask package --debug --skip-build --nsis
      - name: Exercise native Windows install, rollback and uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $directory = Join-Path (Join-Path target $env:CARGO_BUILD_TARGET) 'debug/native-package'
          $installers = @(Get-ChildItem $directory -Filter '*-setup.exe')
          if ($installers.Count -ne 1) { throw 'Expected exactly one native installer candidate' }
          $env:NEWPORT_TEST_INSTALLER = $installers[0].FullName
          cargo test --locked -p newport-release --test native_package_runtime -- --ignored --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Native installer runtime acceptance failed' }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: runner.os == 'Windows'
        with:
          name: newport-native-${{ matrix.arch }}-unsigned-installer
          path: target/${{ matrix.target }}/debug/native-package/*-setup.exe
          if-no-files-found: error
          retention-days: 7

  agent-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            tools/agent
            tools/xtask
          key: nix-agent
          save-if: ${{ github.event_name != 'pull_request' }}
      - run: nix develop --command cargo xtask check xtask
      - run: nix develop --command cargo xtask check agent
      - run: nix develop --command cargo xtask test https
      - name: Validate workflows
        if: runner.os == 'Linux'
        run: nix develop --command actionlint

  agents:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: tools/xtask
          key: agent-build-harness
          save-if: ${{ github.event_name != 'pull_request' }}
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64
      - run: cargo xtask agents
      - run: cargo xtask test runtime
      - run: cargo xtask artifact record resources/agents
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-agents
          path: resources/agents/
          if-no-files-found: error
          retention-days: 30

  remote:
    needs: agents
    # macOS remote transport coverage; hosted ARM Macs cannot run Linux VMs.
    runs-on: macos-15-intel
    timeout-minutes: 90
    env:
      NEWPORT_PREBUILT: "1"
      NEWPORT_TEST_DOCKER_CONTEXT: colima
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-agents
          path: resources/agents
      - run: chmod +x resources/agents/newport-agent-*
      - run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            .
            tools/xtask
          key: remote
          save-if: ${{ github.event_name != 'pull_request' }}
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      # Compile before the VM reserves host memory. Match fixtures::backend_command
      # so the harness reuses this binary without spending its fixture budget on
      # a cold Intel build (which exceeded 20 minutes on hosted macOS).
      - name: Compile remote backend tests
        timeout-minutes: 40
        run: nix develop .#remote --command cargo test --locked -p newport-backend --lib --no-run --target-dir target
      - name: Start Linux VM
        timeout-minutes: 15
        run: nix develop .#remote --command colima start --cpu 3 --memory 6 --arch x86_64 --vm-type=vz --mount-type=virtiofs
      - run: nix develop .#remote --command cargo xtask test remote
      - name: Docker diagnostics
        if: failure()
        run: |
          nix develop .#remote --command docker info
          nix develop .#remote --command docker ps -a

  # Remote apps need the private newport-remote crates and agent. Pull
  # requests from forks get no key and skip them; main must build them.
  remote-apps-access:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      available: ${{ steps.key.outputs.available }}
    steps:
      - id: key
        env:
          KEY: ${{ secrets.NEWPORT_REMOTE_DEPLOY_KEY }}
        run: if [ -n "$KEY" ]; then echo available=true; else echo available=false; fi >> "$GITHUB_OUTPUT"

  # Each archive is packed once, natively, and every later build of this
  # commit (the Remote apps check, the release) embeds these exact bytes.
  remote-agents:
    name: Remote apps agent (${{ matrix.arch }})
    needs: remote-apps-access
    if: needs.remote-apps-access.outputs.available == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      NEWPORT_REMOTE_DIR: ${{ github.workspace }}/newport-remote
    defaults:
      run:
        working-directory: newport
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          path: newport
          persist-credentials: false
      - id: revision
        run: echo "commit=$(cat .github/newport-remote-revision)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ruiyangke/newport-remote
          ref: ${{ steps.revision.outputs.commit }}
          path: newport-remote
          ssh-key: ${{ secrets.NEWPORT_REMOTE_DEPLOY_KEY }}
          persist-credentials: false
      - run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            newport/tools/xtask
            newport-remote
          key: remote-agent-${{ matrix.arch }}
          save-if: ${{ github.event_name != 'pull_request' }}
      # newport-remote's own tooling links its client's audio and AV1 libraries;
      # libaom needs an assembler on x86_64.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libopus-dev libclang-dev nasm
      - run: cargo xtask remote-agents --arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: remote-agent-${{ matrix.arch }}
          path: newport/target/remote-agent/${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 30

  remote-apps:
    name: Remote apps (macos-arm64)
    needs: [agents, remote-agents]
    runs-on: macos-15
    timeout-minutes: 90
    env:
      NEWPORT_PREBUILT: "1"
      NEWPORT_REMOTE_DIR: ${{ github.workspace }}/newport-remote
    defaults:
      run:
        working-directory: newport
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          path: newport
          persist-credentials: false
      - id: revision
        run: echo "commit=$(cat .github/newport-remote-revision)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ruiyangke/newport-remote
          ref: ${{ steps.revision.outputs.commit }}
          path: newport-remote
          ssh-key: ${{ secrets.NEWPORT_REMOTE_DEPLOY_KEY }}
          persist-credentials: false
      - run: rustup show
      - name: Install Metal shader compiler
        run: xcrun --sdk macosx metal --version || { xcodebuild -downloadComponent MetalToolchain && xcrun --sdk macosx metal --version; }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            newport
            newport/tools/xtask
          key: remote-apps
          save-if: ${{ github.event_name != 'pull_request' }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-agents
          path: newport/resources/agents
      - run: cargo xtask artifact verify resources/agents
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: remote-agent-*
          path: newport/target/remote-agent
          merge-multiple: true
      - run: cargo xtask grammars
      - name: Prepare pinned Ghostty build dependencies
        run: cargo xtask env --github
      - run: cargo xtask test remote-apps
      - name: Package the app with Remote apps
        run: cargo xtask package --debug --remote-apps

  passed:
    name: All checks passed
    if: always()
    needs: [tooling, native-core, native-ui, agent-tests, agents, remote, remote-apps-access, remote-agents, remote-apps]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every check
        env:
          RESULTS: ${{ toJSON(needs) }}
          REMOTE_APPS: ${{ needs.remote-apps-access.outputs.available }}
          EVENT: ${{ github.event_name }}
        run: |
          # Only a pull request without the key may skip Remote apps.
          optional='[]'
          if [ "$REMOTE_APPS" != true ]; then
            if [ "$EVENT" != pull_request ]; then
              echo "Remote apps weren't built: set the NEWPORT_REMOTE_DEPLOY_KEY secret" >&2
              exit 1
            fi
            optional='["remote-agents", "remote-apps"]'
          fi
          failed=$(jq -r --argjson optional "$optional" 'to_entries | map(select(.value.result != "success" and ((.value.result == "skipped" and (.key as $k | $optional | index($k))) | not)) | .key) | join(", ")' <<< "$RESULTS")
          if [ -n "$failed" ]; then echo "Checks did not pass: $failed" >&2; exit 1; fi
