name: Shared checks
on:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to validate and build
        required: true
        type: string
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
jobs:
  tooling:
    name: Release tooling and Git protocol contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/git-contract/package-lock.json
      - run: npm ci --prefix tools/git-contract
      - run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            .
            tools/agent
            tools/test-harness
          key: native-contracts
          save-if: ${{ github.event_name != 'pull_request' }}
      - run: sudo apt-get update && sudo apt-get install -y minisign nsis
      - run: npm run test:tooling
      - run: npm run check:contracts
      - name: Replay real CLI responses through native validators and the protocol oracle
        run: npm run test:git-cli-contract -- --output target/git-contract.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: git-contract
          path: target/git-contract.json
          if-no-files-found: error
          retention-days: 7

  # Interactive launch/IME/clipboard/DPI acceptance remains a release gate
  # even when native build/test jobs pass. Compare against the released app.
  native-core:
    name: Native contracts and IPC (${{ matrix.arch }})
    needs: agents
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: macos-arm64
            target: aarch64-apple-darwin
          - os: windows-2025
            arch: windows-x64
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            arch: windows-arm64
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CARGO_BUILD_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - run: rustup show
      - run: rustup target add ${{ matrix.target }}
      - name: Check native source formatting
        run: cargo fmt -p newport-domain -p newport-client -p newport-platform -p newport-backend -p newport-gpui -p newport-app -p newport-grammars -p newport-release -p newport-terminal --check
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: .
          key: native-core-${{ matrix.arch }}
          save-if: ${{ github.event_name != 'pull_request' }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-agents
          path: resources/agents
      - run: node scripts/ci/artifact.mjs verify resources/agents
      - run: cargo clippy --locked -p newport-domain -p newport-platform -p newport-backend -p newport-client -p newport-release --features newport-platform/updates,newport-release/signing --all-targets -- -D warnings
      - run: cargo test --locked -p newport-domain -p newport-platform -p newport-backend -p newport-client -p newport-release --features newport-platform/updates,newport-release/signing
      - name: Verify SSH transport and PTY fixture
        if: runner.os == 'macOS'
        run: env -u CARGO_BUILD_TARGET cargo run --locked --manifest-path tools/test-harness/Cargo.toml -- ssh
      - name: Verify Windows credential storage and cleanup
        if: runner.os == 'Windows'
        run: cargo test --locked -p newport-platform --lib secrets::windows::tests::credential_manager_preserves_legacy_key_and_isolates_profiles -- --exact --ignored
      - name: Verify native system notification delivery
        if: runner.os == 'macOS'
        run: cargo run --locked -p newport-platform --example system_events_check

  native-ui:
    name: Native UI (${{ matrix.arch }})
    needs: agents
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: macos-arm64
            target: aarch64-apple-darwin
          - os: windows-2025
            arch: windows-x64
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            arch: windows-arm64
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CARGO_BUILD_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - run: rustup show
      - run: rustup target add ${{ matrix.target }}
      - name: Install Metal shader compiler
        if: runner.os == 'macOS'
        run: node scripts/ci/prepare-metal.mjs
      - uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1.5.2
        if: runner.os == 'Windows' && matrix.arch == 'windows-x64'
      - name: Locate LLVM for ARM64 dependencies
        if: runner.os == 'Windows' && matrix.arch == 'windows-arm64'
        shell: pwsh
        run: |
          $llvm = 'C:\Program Files\LLVM\bin'
          if (!(Test-Path "$llvm\clang.exe")) { throw 'LLVM is required for ARM64' }
          $llvm >> $env:GITHUB_PATH
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: .
          key: native-ui-${{ matrix.arch }}
          save-if: ${{ github.event_name != 'pull_request' }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-agents
          path: resources/agents
      - run: node scripts/ci/artifact.mjs verify resources/agents
      - run: node scripts/build-grammars.mjs
      - name: Stage Windows PDF renderer
        if: runner.os == 'Windows'
        run: node scripts/stage-pdfium.mjs
      - name: Prepare pinned Ghostty build dependencies
        run: node scripts/with-ghostty.mjs --github
      - run: cargo clippy --locked -p newport-domain -p newport-client -p newport-gpui -p newport-app -p newport-terminal --all-targets -- -D warnings
      - run: cargo test --locked -p newport-client -p newport-gpui -p newport-app -p newport-terminal
      - run: cargo test --locked -p newport-platform --features pdf pdf::tests
      - run: cargo build --locked -p newport-gpui -p newport-app
      - name: Verify standalone startup and profile ownership
        run: cargo test --locked -p newport-app --test standalone_lifecycle -- --ignored --skip standalone_gui --nocapture
      - name: Build native macOS app bundle
        if: runner.os == 'macOS'
        run: node scripts/package-native.mjs --debug --skip-build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: runner.os == 'macOS'
        with:
          name: newport-native-${{ matrix.arch }}-adhoc-app
          path: target/${{ matrix.target }}/debug/native-package/Newport-macos.zip
          if-no-files-found: error
          retention-days: 7
      - name: Verify native Windows executable identity
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $product = Get-Content resources/app.json -Raw | ConvertFrom-Json
          $binary = Join-Path (Join-Path target $env:CARGO_BUILD_TARGET) 'debug/newport.exe'
          $info = [System.Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path $binary).Path)
          if ($info.ProductName -ne $product.productName -or
              $info.FileDescription -ne $product.productName -or
              $info.ProductVersion -ne $product.version -or
              $info.FileVersion -ne $product.version -or
              $info.OriginalFilename -ne 'newport.exe') {
            throw 'Native executable resources do not match the release identity'
          }
      - name: Locate native Windows installer compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $nsis = 'C:\Program Files (x86)\NSIS'
          if (!(Test-Path "$nsis\makensis.exe")) {
            choco install nsis --version=3.11 --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed' }
          }
          if (!(Test-Path "$nsis\makensis.exe")) { throw 'NSIS compiler not found' }
          $nsis >> $env:GITHUB_PATH
      - name: Build native Windows installer candidate
        if: runner.os == 'Windows'
        run: node scripts/package-native.mjs --debug --skip-build --nsis
      - name: Exercise native Windows install, rollback, released upgrade and uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $directory = Join-Path (Join-Path target $env:CARGO_BUILD_TARGET) 'debug/native-package'
          $installers = @(Get-ChildItem $directory -Filter '*-setup.exe')
          if ($installers.Count -ne 1) { throw 'Expected exactly one native installer candidate' }
          $env:NEWPORT_TEST_INSTALLER = $installers[0].FullName
          cargo test --locked -p newport-release --test native_package_runtime -- --ignored --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Native installer runtime acceptance failed' }
          $baseline = Get-Content resources/test-fixtures/legacy-desktop-release.json -Raw | ConvertFrom-Json
          $arch = $env:CARGO_BUILD_TARGET.Split('-')[0]
          $assets = @($baseline.assets | Where-Object { $_.name -eq "Newport-0.3.0-windows-$arch-setup.exe" })
          if ($assets.Count -ne 1) { throw 'Expected one pinned released installer for this architecture' }
          $asset = $assets[0]
          $download = Join-Path $env:RUNNER_TEMP $asset.name
          Invoke-WebRequest -Uri $asset.url -OutFile $download -TimeoutSec 120
          if ((Get-FileHash $download -Algorithm SHA256).Hash.ToLowerInvariant() -ne $asset.sha256) {
            throw 'Released installer digest differs from the pinned baseline'
          }
          $env:NEWPORT_TEST_LEGACY_INSTALLER = $download
          cargo test --locked -p newport-release --test native_package_runtime -- --ignored --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Released-to-native installer acceptance failed' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: runner.os == 'Windows'
        with:
          name: newport-native-${{ matrix.arch }}-unsigned-installer
          path: target/${{ matrix.target }}/debug/native-package/*-setup.exe
          if-no-files-found: error
          retention-days: 7

  agent-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: tools/agent
          key: nix-agent
          save-if: ${{ github.event_name != 'pull_request' }}
      - run: nix develop --command npm run check:harness
      - run: nix develop --command npm run check:agent
      - run: nix develop --command npm run test:https
      - name: Validate workflows
        if: runner.os == 'Linux'
        run: nix develop --command actionlint

  agents:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: tools/test-harness
          key: agent-build-harness
          save-if: ${{ github.event_name != 'pull_request' }}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - run: bash scripts/build-agent.sh
      - run: cargo run --locked --manifest-path tools/test-harness/Cargo.toml -- runtime
      - run: node scripts/ci/artifact.mjs record resources/agents
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-agents
          path: resources/agents/
          if-no-files-found: error
          retention-days: 7

  remote:
    needs: agents
    # macOS remote transport coverage; hosted ARM Macs cannot run Linux VMs.
    runs-on: macos-15-intel
    timeout-minutes: 90
    env:
      NEWPORT_PREBUILT: "1"
      NEWPORT_TEST_DOCKER_CONTEXT: colima
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-agents
          path: resources/agents
      - run: chmod +x resources/agents/newport-agent-*
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            .
            tools/test-harness
          key: remote
          save-if: ${{ github.event_name != 'pull_request' }}
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      # Compile before the VM reserves host memory. Match fixtures::backend_command
      # so the harness reuses this binary without spending its fixture budget on
      # a cold Intel build (which exceeded 20 minutes on hosted macOS).
      - name: Compile remote backend tests
        timeout-minutes: 40
        run: nix develop .#remote --command cargo test --locked -p newport-backend --lib --no-run --target-dir target
      - name: Start Linux VM
        timeout-minutes: 15
        run: nix develop .#remote --command colima start --cpu 3 --memory 6 --arch x86_64 --vm-type=vz --mount-type=virtiofs
      - run: nix develop .#remote --command npm run test:remote
      - name: Docker diagnostics
        if: failure()
        run: |
          nix develop .#remote --command docker info
          nix develop .#remote --command docker ps -a

  passed:
    name: All checks passed
    if: always()
    needs: [tooling, native-core, native-ui, agent-tests, agents, remote]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every check
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module <<'JS'
          const results = JSON.parse(process.env.RESULTS);
          const failed = Object.entries(results).filter(([, job]) => job.result !== 'success').map(([name]) => name);
          if (failed.length) { console.error('Checks did not pass: ' + failed.join(', ')); process.exit(1); }
          JS
