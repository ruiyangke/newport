name: Shared checks
on:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to validate and build
        required: true
        type: string
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright test --config playwright.production.config.ts
      - run: npm run test:cockpit
      - run: sudo apt-get update && sudo apt-get install -y minisign
      - run: node scripts/test-update-manifests.mjs
      - run: node --test scripts/ci/*.test.mjs
      - run: node scripts/ci/artifact.mjs record dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend
          path: dist
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: browser-test-results
          path: test-results
          retention-days: 7

  agent-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: tools/agent
          key: nix-agent
          save-if: ${{ github.event_name != 'pull_request' }}
      - run: nix develop --command npm run check:harness
      - run: nix develop --command npm run check:agent
      - run: nix develop --command npm run test:https
      - name: Validate workflows
        if: runner.os == 'Linux'
        run: nix develop --command actionlint

  agents:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: tools/test-harness
          key: agent-build-harness
          save-if: ${{ github.event_name != 'pull_request' }}
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64
      - run: bash scripts/build-agent.sh
      - run: cargo run --locked --manifest-path tools/test-harness/Cargo.toml -- runtime
      - run: node scripts/ci/artifact.mjs record src-tauri/agents
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-agents
          path: src-tauri/agents/
          if-no-files-found: error
          retention-days: 7

  desktop:
    needs: [frontend, agents]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: aarch64
            bundle: app
          - os: windows-2025
            arch: x86_64
            bundle: nsis
          - os: windows-11-arm
            arch: aarch64
            bundle: nsis
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      NEWPORT_PREBUILT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-agents
          path: src-tauri/agents
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend
          path: dist
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          key: desktop-${{ matrix.arch }}
          save-if: ${{ github.event_name != 'pull_request' }}
      - uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1.5.2
        if: runner.os == 'Windows' && matrix.arch == 'x86_64'
      - name: Locate LLVM for ARM64 dependencies
        if: runner.os == 'Windows' && matrix.arch == 'aarch64'
        shell: pwsh
        run: |
          $llvm = 'C:\Program Files\LLVM\bin'
          if (!(Test-Path "$llvm\clang.exe")) { throw 'LLVM is required for ARM64' }
          $llvm >> $env:GITHUB_PATH
      - run: npm ci
      - run: node scripts/prepare-build.mjs
      - run: node --test scripts/ci/release.test.mjs
      - run: npm run check:rust
      - run: npm run test:ssh
        if: runner.os == 'macOS'
      - run: npm run tauri build -- --bundles ${{ matrix.bundle }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: runner.os == 'Windows'
        with:
          name: newport-windows-${{ matrix.arch }}-unsigned
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7

  remote:
    needs: agents
    # The real desktop backend requires macOS; hosted ARM Macs cannot run Linux VMs.
    runs-on: macos-15-intel
    timeout-minutes: 60
    env:
      NEWPORT_PREBUILT: "1"
      NEWPORT_TEST_DOCKER_CONTEXT: colima
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-agents
          path: src-tauri/agents
      - run: chmod +x src-tauri/agents/newport-agent-*
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          key: remote
          save-if: ${{ github.event_name != 'pull_request' }}
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Start Linux VM
        timeout-minutes: 15
        run: nix develop .#remote --command colima start --cpu 3 --memory 6 --arch x86_64 --vm-type=vz --mount-type=virtiofs
      - run: nix develop .#remote --command npm run test:remote
      - name: Docker diagnostics
        if: failure()
        run: |
          nix develop .#remote --command docker info
          nix develop .#remote --command docker ps -a

  passed:
    name: All checks passed
    if: always()
    needs: [frontend, agent-tests, agents, desktop, remote]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every check
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module <<'JS'
          const results = JSON.parse(process.env.RESULTS);
          const failed = Object.entries(results).filter(([, job]) => job.result !== 'success').map(([name]) => name);
          if (failed.length) { console.error('Checks did not pass: ' + failed.join(', ')); process.exit(1); }
          JS
