name: Agent compatibility
on:
  push:
    paths: ['tools/agent/**', 'src-tauri/src/agent-install.sh', 'flake.nix', 'flake.lock', 'package.json', '.github/workflows/agent.yml']
  pull_request:
    paths: ['tools/agent/**', 'src-tauri/src/agent-install.sh', 'flake.nix', 'flake.lock', 'package.json', '.github/workflows/agent.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
      - name: Check agent in the locked development environment
        run: nix develop --command npm run check:agent
