name: Windows desktop
on:
  push:
    paths: ['src/**', 'src-tauri/**', 'tools/agent/**', 'scripts/build-agent*', 'package*.json', '.github/workflows/windows.yml']
  pull_request:
    paths: ['src/**', 'src-tauri/**', 'tools/agent/**', 'scripts/build-agent*', 'package*.json', '.github/workflows/windows.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  agents:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: bash scripts/build-agent.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-agents
          path: src-tauri/agents/porthop-agent-*
          if-no-files-found: error
  windows:
    needs: agents
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-agents
          path: src-tauri/agents
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: ilammy/setup-nasm@v1
      - run: npm ci
      - run: npm run build
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: npm run tauri build -- --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: porthop-windows-x64-unsigned
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
