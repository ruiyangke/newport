name: Native desktop release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag (for example v0.3.0)
        required: true
        type: string
      ci_commit:
        description: Optional passing CI commit for release-tooling-only changes (full SHA)
        required: false
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: desktop-release
  cancel-in-progress: false
jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.version.outputs.commit }}
      ci_commit: ${{ steps.version.outputs.ci_commit }}
      ci_run_id: ${{ steps.version.outputs.ci_run_id }}
      agents_artifact_id: ${{ steps.version.outputs.agents_artifact_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - run: rustup show
      - id: version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_CI_COMMIT: ${{ inputs.ci_commit }}
          GH_TOKEN: ${{ github.token }}
        run: cargo xtask release verify --ci

  needle-release:
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - run: rustup show
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.resolve.outputs.agents_artifact_id }}
          run-id: ${{ needs.resolve.outputs.ci_run_id }}
          github-token: ${{ github.token }}
          path: resources/agents
          merge-multiple: true
      - name: Verify CI artifact and bind unchanged Needle source to release
        env:
          CI_COMMIT: ${{ needs.resolve.outputs.ci_commit }}
          RELEASE_COMMIT: ${{ needs.resolve.outputs.commit }}
        run: |
          git checkout --detach "$CI_COMMIT"
          cargo xtask artifact verify resources/agents
          git checkout --detach "$RELEASE_COMMIT"
          cargo xtask artifact record resources/agents
      # Compile release tooling before any step receives signing secrets.
      - run: cargo build --locked --manifest-path tools/xtask/Cargo.toml
      - name: Sign exact Needle release payloads
        env:
          NEWPORT_SIGNING_PRIVATE_KEY: ${{ secrets.NEWPORT_SIGNING_PRIVATE_KEY }}
          NEWPORT_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.NEWPORT_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: tools/xtask/target/debug/xtask release sign-needle
      - run: cargo xtask artifact record resources/agents
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-agents-signed
          path: resources/agents
          if-no-files-found: error

  macos:
    needs: [resolve, needle-release]
    env:
      CARGO_INCREMENTAL: "0"
      NEWPORT_REQUIRE_NEEDLE_RELEASE: "1"
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          persist-credentials: false
      - run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            .
            tools/xtask
          key: release-macos
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-agents-signed
          path: resources/agents
      - run: xcrun --sdk macosx metal --version || { xcodebuild -downloadComponent MetalToolchain && xcrun --sdk macosx metal --version; }
      - run: rustup target add aarch64-apple-darwin
      - run: cargo xtask artifact verify resources/agents
      - name: Prepare pinned terminal build dependencies
        run: cargo xtask env --github
      # Compile release tooling before any step receives signing secrets.
      - run: cargo build --locked --manifest-path tools/xtask/Cargo.toml
      - name: Configure signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
          APPLE_ENTITLEMENTS: ${{ secrets.APPLE_ENTITLEMENTS }}
        run: tools/xtask/target/debug/xtask release setup-signing
      - name: Build signed and notarized artifacts
        env:
          APPLE_SIGNING_IDENTITY: "Developer ID Application: Ruiyang Ke (X6ZPK45A26)"
          APPLE_TEAM_ID: X6ZPK45A26
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          NEWPORT_SIGNING_PRIVATE_KEY: ${{ secrets.NEWPORT_SIGNING_PRIVATE_KEY }}
          NEWPORT_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.NEWPORT_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: tools/xtask/target/debug/xtask release macos
      - name: Verify the signed release executable preserves upgrade profiles
        env:
          NEWPORT_TEST_APP: ${{ github.workspace }}/target/aarch64-apple-darwin/release/native-package/Newport.app/Contents/MacOS/newport
        run: cargo test --locked --release --target aarch64-apple-darwin -p newport-app --test standalone_lifecycle -- --ignored --skip standalone_gui --nocapture --test-threads=1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-macos
          path: target/aarch64-apple-darwin/release/native-package/distribution/update/*
          if-no-files-found: error
      - name: Remove temporary signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/release.keychain-db" || true

  windows:
    needs: [resolve, needle-release]
    env:
      CARGO_INCREMENTAL: "0"
      NEWPORT_REQUIRE_NEEDLE_RELEASE: "1"
      CARGO_BUILD_TARGET: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            arch: x86_64
            target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            arch: aarch64
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-agents-signed
          path: resources/agents
      - run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            .
            tools/xtask
          key: release-windows-${{ matrix.arch }}
      - uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1.5.2
        if: matrix.arch == 'x86_64'
      - name: Locate LLVM for ARM64 dependencies
        if: matrix.arch == 'aarch64'
        shell: pwsh
        run: |
          $llvm = 'C:\Program Files\LLVM\bin'
          if (!(Test-Path "$llvm\clang.exe")) { throw 'LLVM is required for ARM64' }
          $llvm >> $env:GITHUB_PATH
      - run: rustup target add ${{ matrix.target }}
      - run: cargo xtask artifact verify resources/agents
      - name: Locate native Windows installer compiler
        shell: pwsh
        run: |
          $nsis = 'C:\Program Files (x86)\NSIS'
          if (!(Test-Path "$nsis\makensis.exe")) {
            choco install nsis --version=3.11 --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed' }
          }
          if (!(Test-Path "$nsis\makensis.exe")) { throw 'NSIS compiler not found' }
          $nsis >> $env:GITHUB_PATH
      - name: Prepare pinned terminal build dependencies
        run: cargo xtask env --github
      - run: cargo xtask package --nsis
      - name: Verify the release executable and installer preserve profiles
        shell: pwsh
        run: |
          $directory = Join-Path (Join-Path target $env:CARGO_BUILD_TARGET) 'release/native-package'
          $env:NEWPORT_TEST_APP = (Resolve-Path (Join-Path $directory 'Newport/newport.exe')).Path
          cargo test --locked --release -p newport-app --test standalone_lifecycle -- --ignored --skip standalone_gui --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'Packaged release startup acceptance failed' }
          $installers = @(Get-ChildItem $directory -Filter '*-setup.exe')
          if ($installers.Count -ne 1) { throw 'Expected exactly one native release installer' }
          $env:NEWPORT_TEST_INSTALLER = $installers[0].FullName
          cargo test --locked --release -p newport-release --test native_package_runtime -- --ignored --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'Release installer runtime acceptance failed' }
      # Compile release tooling before any step receives signing secrets.
      - run: cargo build --locked --manifest-path tools/xtask/Cargo.toml
      - name: Sign updater package
        shell: pwsh
        env:
          NEWPORT_SIGNING_PRIVATE_KEY: ${{ secrets.NEWPORT_SIGNING_PRIVATE_KEY }}
          NEWPORT_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.NEWPORT_SIGNING_PRIVATE_KEY_PASSWORD }}
          UPDATE_ARCH: ${{ matrix.arch }}
        run: |
          $directory = Join-Path (Join-Path target $env:CARGO_BUILD_TARGET) 'release/native-package'
          $installers = @(Get-ChildItem $directory -Filter '*-setup.exe')
          if ($installers.Count -ne 1) { throw 'Expected exactly one NSIS installer' }
          $xtask = Join-Path (Join-Path 'tools/xtask/target' $env:CARGO_BUILD_TARGET) 'debug/xtask.exe'
          & $xtask release windows-update $installers[0].FullName --arch $env:UPDATE_ARCH --app-executable (Join-Path $directory 'Newport/newport.exe') --output (Join-Path $directory 'update')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-windows-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release/native-package/update/*
          if-no-files-found: error

  draft:
    needs: [resolve, macos, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-macos
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-windows-*
          path: release
          merge-multiple: true
      - run: rustup show
      - name: Merge all update targets and create draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_COMMIT: ${{ needs.resolve.outputs.commit }}
        run: |
          cargo test --locked --manifest-path tools/xtask/Cargo.toml release::manifest::
          cargo xtask release merge release/latest.json release/windows-*.json --version "${RELEASE_TAG#v}" --output release/latest.json
          rm release/windows-*.json
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)" = "$RELEASE_COMMIT"
          gh release create "$RELEASE_TAG" release/* --verify-tag --draft --title "Newport $RELEASE_TAG" --generate-notes
