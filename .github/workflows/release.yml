name: Desktop release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag (for example v0.3.0)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: desktop-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - run: npm ci
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python3 - <<'PY'
          import json, os, tomllib
          version = json.load(open('package.json'))['version']
          assert os.environ['RELEASE_TAG'] == 'v' + version
          assert json.load(open('src-tauri/tauri.conf.json'))['version'] == version
          assert tomllib.load(open('src-tauri/Cargo.toml', 'rb'))['package']['version'] == version
          PY
      - name: Configure signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
          APPLE_ENTITLEMENTS: ${{ secrets.APPLE_ENTITLEMENTS }}
        run: |
          python3 - <<'PY'
          import base64, os, pathlib, plistlib, secrets, subprocess
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          for name in ['APPLE_CERTIFICATE', 'APPLE_PROVISIONING_PROFILE', 'APPLE_ENTITLEMENTS']:
              if not os.environ.get(name): raise SystemExit('Missing secret: ' + name)
          cert = root / 'signing.p12'
          cert.write_bytes(base64.b64decode(os.environ['APPLE_CERTIFICATE']))
          profile = root / 'release.provisionprofile'
          profile.write_bytes(base64.b64decode(os.environ['APPLE_PROVISIONING_PROFILE']))
          ent = root / 'release.entitlements'
          ent.write_text(os.environ['APPLE_ENTITLEMENTS'])
          assert not plistlib.loads(ent.read_bytes()).get('com.apple.security.get-task-allow')
          kc = str(root / 'release.keychain-db')
          pw = secrets.token_urlsafe(32)
          def run(*args):
              result = subprocess.run(args, stdout=subprocess.DEVNULL)
              if result.returncode: raise SystemExit("Signing setup failed: " + args[0])
          run('security', 'create-keychain', '-p', pw, kc)
          run('security', 'set-keychain-settings', '-lut', '7200', kc)
          run('security', 'unlock-keychain', '-p', pw, kc)
          run('security', 'import', str(cert), '-k', kc, '-P', os.environ['APPLE_CERTIFICATE_PASSWORD'], '-T', '/usr/bin/codesign')
          run('security', 'set-key-partition-list', '-S', 'apple-tool:,apple:,codesign:', '-s', '-k', pw, kc)
          run('security', 'list-keychains', '-d', 'user', '-s', kc)
          with open(os.environ['GITHUB_ENV'], 'a') as out:
              out.write(f'PORTHOP_PROVISIONING_PROFILE={profile}\nPORTHOP_SIGNING_ENTITLEMENTS={ent}\n')
          PY
      - name: Build signed and notarized artifacts
        env:
          APPLE_SIGNING_IDENTITY: "Developer ID Application: Ruiyang Ke (X6ZPK45A26)"
          APPLE_TEAM_ID: X6ZPK45A26
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: scripts/release-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: src-tauri/target/release/update/*
          if-no-files-found: error
      - name: Remove temporary signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/release.keychain-db" || true

  agents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - run: bash scripts/build-agent.sh
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-agents
          path: src-tauri/agents/porthop-agent-*
          if-no-files-found: error

  windows:
    needs: agents
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x86_64
          - runner: windows-11-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          name: release-linux-agents
          path: src-tauri/agents
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: ilammy/setup-nasm@v1
        if: matrix.arch == 'x86_64'
      - name: Locate LLVM for ARM64 dependencies
        if: matrix.arch == 'aarch64'
        shell: pwsh
        run: |
          $llvm = 'C:\Program Files\LLVM\bin'
          if (!(Test-Path "$llvm\clang.exe")) { throw 'LLVM is required for ARM64' }
          $llvm >> $env:GITHUB_PATH
      - run: npm ci
      - name: Verify release version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tauriVersion = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne "v$version" -or $tauriVersion -ne $version) { throw 'Release version mismatch' }
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: npm run tauri build -- --bundles nsis
      - name: Sign updater package
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          UPDATE_ARCH: ${{ matrix.arch }}
        run: |
          $installers = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe)
          if ($installers.Count -ne 1) { throw 'Expected exactly one NSIS installer' }
          python scripts/package-windows-update.py $installers[0].FullName --arch $env:UPDATE_ARCH --output src-tauri/target/release/update
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-${{ matrix.arch }}
          path: src-tauri/target/release/update/*
          if-no-files-found: error

  draft:
    needs: [build, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          pattern: release-macos
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: release-windows-*
          path: release
          merge-multiple: true
      - run: sudo apt-get update && sudo apt-get install -y minisign
      - name: Merge all update targets and create draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python3 scripts/test-update-manifests.py
          python3 scripts/merge-update-manifests.py release/latest.json release/windows-*.json --version "${RELEASE_TAG#v}" --output release/latest.json
          rm release/windows-*.json
          gh release create "$RELEASE_TAG" release/* --verify-tag --draft --title "Porthop $RELEASE_TAG" --generate-notes
