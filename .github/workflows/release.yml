name: Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag (for example v0.5.0)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: desktop-release
  cancel-in-progress: false
# Jobs are named "Area: what (platform)", as in checks.yml. A release needs
# only its tag: everything it ships is built here, from the tagged commit.
jobs:
  resolve:
    name: "Release: verify tag"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - run: rustup show
      - id: version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: cargo xtask release verify
      - name: Check release storage configuration
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$R2_ACCESS_KEY_ID" || { echo 'Missing repository secret R2_ACCESS_KEY_ID'; exit 1; }
          test -n "$R2_SECRET_ACCESS_KEY" || { echo 'Missing repository secret R2_SECRET_ACCESS_KEY'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing repository variable CLOUDFLARE_ACCOUNT_ID'; exit 1; }

  # As in checks.yml: each architecture on a runner of that architecture.
  needle-build:
    name: "Needle: build (${{ matrix.arch }})"
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          persist-credentials: false
      - uses: ./.github/actions/rust
        with:
          cache-key: needle-build-${{ matrix.arch }}
          workspaces: tools/xtask
      - run: cargo xtask agents --arch ${{ matrix.arch }}
      - run: cargo xtask test runtime --arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: needle-${{ matrix.arch }}
          path: resources/agents/newport-agent-${{ matrix.arch }}
          if-no-files-found: error

  needle-release:
    name: "Needle: sign"
    needs: [resolve, needle-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          persist-credentials: false
      - uses: ./.github/actions/rust
        with:
          cache-key: needle-release
          workspaces: tools/xtask
      - uses: actions/download-artifact@v8
        with:
          pattern: needle-*
          path: resources/agents
          merge-multiple: true
      - run: chmod +x resources/agents/newport-agent-*
      - run: cargo xtask artifact record resources/agents
      # Compile release tooling before any step receives signing secrets.
      - run: cargo build --locked --manifest-path tools/xtask/Cargo.toml
      - name: Sign exact Needle release payloads
        env:
          NEWPORT_SIGNING_PRIVATE_KEY: ${{ secrets.NEWPORT_SIGNING_PRIVATE_KEY }}
          NEWPORT_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.NEWPORT_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: tools/xtask/target/debug/xtask release sign-needle
      - run: cargo xtask artifact record resources/agents
      - uses: actions/upload-artifact@v7
        with:
          name: linux-agents-signed
          path: resources/agents
          if-no-files-found: error

  # The Remote apps agent the macOS app embeds, as in checks.yml.
  remote-apps-agent:
    name: "Remote apps: agent (${{ matrix.arch }})"
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      NEWPORT_REMOTE_DIR: ${{ github.workspace }}/newport-remote
    defaults:
      run:
        working-directory: newport
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          path: newport
          persist-credentials: false
      - id: revision
        run: echo "commit=$(cat .github/newport-remote-revision)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: ruiyangke/newport-remote
          ref: ${{ steps.revision.outputs.commit }}
          path: newport-remote
          ssh-key: ${{ secrets.NEWPORT_REMOTE_DEPLOY_KEY }}
          persist-credentials: false
      - uses: ./newport/.github/actions/rust
        with:
          working-directory: newport
          cache-key: remote-apps-agent-${{ matrix.arch }}
          workspaces: |
            newport/tools/xtask
            newport-remote
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libopus-dev libclang-dev nasm
      - run: cargo xtask remote-agents --arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: remote-agent-${{ matrix.arch }}
          path: newport/target/remote-agent/${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  macos:
    name: "Desktop: macOS (signed, notarized, Remote apps)"
    needs: [resolve, needle-release, remote-apps-agent]
    env:
      CARGO_INCREMENTAL: "0"
      NEWPORT_REQUIRE_NEEDLE_RELEASE: "1"
      # Remote apps: the private crates beside Newport, and this run's agent archives.
      NEWPORT_REMOTE_DIR: ${{ github.workspace }}/newport-remote
      NEWPORT_PREBUILT: "1"
    runs-on: macos-15
    timeout-minutes: 120
    defaults:
      run:
        working-directory: newport
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          path: newport
          persist-credentials: false
      - id: revision
        run: echo "commit=$(cat .github/newport-remote-revision)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: ruiyangke/newport-remote
          ref: ${{ steps.revision.outputs.commit }}
          path: newport-remote
          ssh-key: ${{ secrets.NEWPORT_REMOTE_DEPLOY_KEY }}
          persist-credentials: false
      - uses: ./newport/.github/actions/rust
        with:
          working-directory: newport
          target: aarch64-apple-darwin
          cache-key: release-macos
          workspaces: |
            newport
            newport/tools/xtask
      - uses: actions/download-artifact@v8
        with:
          name: linux-agents-signed
          path: newport/resources/agents
      - uses: actions/download-artifact@v8
        with:
          pattern: remote-agent-*
          path: newport/target/remote-agent
          merge-multiple: true
      - run: xcrun --sdk macosx metal --version || { xcodebuild -downloadComponent MetalToolchain && xcrun --sdk macosx metal --version; }
      - run: cargo xtask artifact verify resources/agents
      - name: Prepare pinned terminal build dependencies
        run: cargo xtask env --github
      # Compile release tooling before any step receives signing secrets.
      - run: cargo build --locked --manifest-path tools/xtask/Cargo.toml
      - name: Configure signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
          APPLE_ENTITLEMENTS: ${{ secrets.APPLE_ENTITLEMENTS }}
        run: tools/xtask/target/debug/xtask release setup-signing
      - name: Build signed and notarized artifacts
        env:
          APPLE_SIGNING_IDENTITY: "Developer ID Application: Ruiyang Ke (X6ZPK45A26)"
          APPLE_TEAM_ID: X6ZPK45A26
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          NEWPORT_SIGNING_PRIVATE_KEY: ${{ secrets.NEWPORT_SIGNING_PRIVATE_KEY }}
          NEWPORT_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.NEWPORT_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: tools/xtask/target/debug/xtask release macos --remote-apps
      - name: Verify the signed release executable preserves upgrade profiles
        env:
          NEWPORT_TEST_APP: ${{ github.workspace }}/newport/target/aarch64-apple-darwin/release/native-package/Newport.app/Contents/MacOS/newport
        run: cargo test --locked --release --target aarch64-apple-darwin -p newport-app --test standalone_lifecycle -- --ignored --skip standalone_gui --nocapture --test-threads=1
      - uses: actions/upload-artifact@v7
        with:
          name: release-macos
          path: newport/target/aarch64-apple-darwin/release/native-package/distribution/update/*
          if-no-files-found: error
      - name: Remove temporary signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/release.keychain-db" || true

  windows:
    name: "Desktop: Windows (${{ matrix.arch }})"
    needs: [resolve, needle-release]
    env:
      CARGO_INCREMENTAL: "0"
      NEWPORT_REQUIRE_NEEDLE_RELEASE: "1"
      CARGO_BUILD_TARGET: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            arch: x86_64
            target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            arch: aarch64
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: linux-agents-signed
          path: resources/agents
      - uses: ./.github/actions/rust
        with:
          target: ${{ matrix.target }}
          cache-key: release-windows-${{ matrix.arch }}
      - uses: ilammy/setup-nasm@v1
        if: matrix.arch == 'x86_64'
      - name: Locate LLVM for ARM64 dependencies
        if: matrix.arch == 'aarch64'
        shell: pwsh
        run: |
          $llvm = 'C:\Program Files\LLVM\bin'
          if (!(Test-Path "$llvm\clang.exe")) { throw 'LLVM is required for ARM64' }
          $llvm >> $env:GITHUB_PATH
      - run: cargo xtask artifact verify resources/agents
      - name: Locate native Windows installer compiler
        shell: pwsh
        run: |
          $nsis = 'C:\Program Files (x86)\NSIS'
          if (!(Test-Path "$nsis\makensis.exe")) {
            choco install nsis --version=3.11 --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed' }
          }
          if (!(Test-Path "$nsis\makensis.exe")) { throw 'NSIS compiler not found' }
          $nsis >> $env:GITHUB_PATH
      - name: Prepare pinned terminal build dependencies
        run: cargo xtask env --github
      - run: cargo xtask package --nsis
      - name: Verify the release executable and installer preserve profiles
        shell: pwsh
        run: |
          $directory = Join-Path (Join-Path target $env:CARGO_BUILD_TARGET) 'release/native-package'
          $env:NEWPORT_TEST_APP = (Resolve-Path (Join-Path $directory 'Newport/newport.exe')).Path
          cargo test --locked --release -p newport-app --test standalone_lifecycle -- --ignored --skip standalone_gui --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'Packaged release startup acceptance failed' }
          $installers = @(Get-ChildItem $directory -Filter '*-setup.exe')
          if ($installers.Count -ne 1) { throw 'Expected exactly one native release installer' }
          $env:NEWPORT_TEST_INSTALLER = $installers[0].FullName
          cargo test --locked --release -p newport-release --test native_package_runtime -- --ignored --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'Release installer runtime acceptance failed' }
      # Compile release tooling before any step receives signing secrets.
      - run: cargo build --locked --manifest-path tools/xtask/Cargo.toml
      - name: Sign updater package
        shell: pwsh
        env:
          NEWPORT_SIGNING_PRIVATE_KEY: ${{ secrets.NEWPORT_SIGNING_PRIVATE_KEY }}
          NEWPORT_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.NEWPORT_SIGNING_PRIVATE_KEY_PASSWORD }}
          UPDATE_ARCH: ${{ matrix.arch }}
        run: |
          $directory = Join-Path (Join-Path target $env:CARGO_BUILD_TARGET) 'release/native-package'
          $installers = @(Get-ChildItem $directory -Filter '*-setup.exe')
          if ($installers.Count -ne 1) { throw 'Expected exactly one NSIS installer' }
          $xtask = Join-Path (Join-Path 'tools/xtask/target' $env:CARGO_BUILD_TARGET) 'debug/xtask.exe'
          & $xtask release windows-update $installers[0].FullName --arch $env:UPDATE_ARCH --app-executable (Join-Path $directory 'Newport/newport.exe') --output (Join-Path $directory 'update')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7
        with:
          name: release-windows-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release/native-package/update/*
          if-no-files-found: error

  distribution:
    name: "Release: publish to Cloudflare"
    needs: [resolve, macos, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: cloudflare-production
      url: https://newport.app/updates/latest.json
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: release-macos
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          pattern: release-windows-*
          path: release
          merge-multiple: true
      - run: rustup show
      - name: Merge and verify all update targets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_COMMIT: ${{ needs.resolve.outputs.commit }}
        run: |
          cargo test --locked --manifest-path tools/xtask/Cargo.toml release::
          cargo xtask release merge release/latest.json release/windows-*.json --version "${RELEASE_TAG#v}" --output release/latest.json
          rm release/windows-*.json
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)" = "$RELEASE_COMMIT"
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ inputs.tag }}
          path: release/*
          if-no-files-found: error
          retention-days: 90
      - name: Build the release publisher before loading credentials
        run: cargo build --locked --manifest-path tools/xtask/Cargo.toml
      - name: Publish verified release to R2
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: tools/xtask/target/debug/xtask release deploy release
