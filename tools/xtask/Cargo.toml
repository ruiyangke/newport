[package]
name = "xtask"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
anyhow = "1"
aws-credential-types = "1.3.1"
aws-sigv4 = { version = "1.6.3", default-features = false, features = ["sign-http", "http1"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
flate2 = "1"
getrandom = "0.3"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
minisign-verify = "0.2.5"
newport-release = { path = "../../crates/newport-release", features = ["signing"] }
plist = "1"
rcgen = "0.14"
semver = "1.0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tar = "0.4"
tempfile = "3"
testcontainers = "0.27"
tokio = { version = "1", features = ["io-util", "net", "process", "rt-multi-thread", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
toml = "0.9"
ureq = "3"
walkdir = "2"
xz2 = "0.1"
zip = { version = "6", default-features = false, features = ["deflate"] }
