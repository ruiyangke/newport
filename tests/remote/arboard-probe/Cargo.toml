[package]
name = "newport-arboard-probe"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

[dependencies]
# Match the agent's existing arboard compatibility suite, without patching arboard.
arboard = { version = "=3.6.1", default-features = false, features = ["image-data", "wayland-data-control"] }
serde_json = "1"
sha2 = "0.10"
