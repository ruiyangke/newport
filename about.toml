# cargo-about's policy for the third-party notices every package ships
# (`cargo xtask notices`). A crate whose license this list can't satisfy fails
# packaging. Newport is AGPL-3.0-only, so only permissive licenses and MPL-2.0
# are accepted: never a third party's GPL, LGPL or AGPL. Earlier entries win
# when a crate offers a choice, and Apache-2.0 comes first because its full
# text needs no copyright line from the crate.
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
]
# Test and benchmark dependencies aren't shipped.
ignore-dev-dependencies = true
# Newport's own crates and the private Remote apps crates are unpublished and
# aren't third-party; packaging checks no other crate is.
private = { ignore = true }

# These grammar crates leave their notices out of the published package, so
# they come from the crate's repository at the commit it was published from.
# The checksums fail the clarification when the text changes.

