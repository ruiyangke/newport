[package]
name = "newport-client"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[dependencies]
newport-platform = { path = "../newport-platform" }
newport-domain = { path = "../newport-domain" }
newport-protocol = { path = "../newport-protocol", features = ["protobuf"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "7"
base64 = "0.23.1"
async-channel = "2"
bytes = "1.12.1"
# Same version and features as gpui-kit's, so editor providers share the types.
lsp-types = { version = "0.97.0", features = ["proposed"] }

[dev-dependencies]
futures-lite = "2"
