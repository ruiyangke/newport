[package]
name = "newport-grammars"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
enum-iterator = "2.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tree-sitter-language = "0.1"
