[package]
name = "newport-app"
version = "0.6.1"
edition = "2024"
publish = false

[features]
# Local development experiment only; no default or product feature forwards it.
experimental-terminal-owned-bus = []

[[bin]]
name = "newport"
path = "src/main.rs"

[dependencies]
newport-backend = { path = "../newport-backend" }
newport-client = { path = "../newport-client" }
newport-domain = { path = "../newport-domain" }
newport-platform = { path = "../newport-platform", features = ["tray", "updates", "pdf"] }
newport-gpui = { path = "../newport-gpui" }
gpui-kit = "=0.8.0"
async-channel = "2"
open = "5"
serde_json = "1"
semver = "1"
tokio = { version = "1", features = ["rt-multi-thread", "signal", "macros"] }
tracing-subscriber = "0.3"

[dev-dependencies]
newport-backend = { path = "../newport-backend", features = ["test-support"] }
tempfile = "3"

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[build-dependencies]
embed-resource = "3.0"
serde_json = "1"
