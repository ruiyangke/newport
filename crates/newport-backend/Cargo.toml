[package]
name = "newport-backend"
version = "0.1.0"
edition = "2024"
publish = false

[features]
# Deterministic isolated Stores for native lifecycle and integration tests.
test-support = []

[dependencies]
newport-domain = { path = "../newport-domain" }
newport-release = { path = "../newport-release", default-features = false }
newport-platform = { path = "../newport-platform", features = ["account"] }
anyhow = "1"
getrandom = "0.4"
dirs = "7"
fs2 = "0.4"
sha1 = "0.11"
russh = "0.63.3"
russh-sftp = "=3.0.0"
ssh2-config = { version = "0.8", features = ["nolog"] }
url = "2"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tar = "0.4"
base64 = "0.23.1"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_bytes = "0.11"
rmp-serde = "1.3.1"
hmac = "0.13"
sha2 = "0.11"
zeroize = "1"
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio", "migrate"] }
iota_stronghold = "=2.1.0"
tempfile = "3"
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }

[dev-dependencies]
minisign = "0.10"
image = { version = "0.25", default-features = false, features = ["png"] }
newport-client = { path = "../newport-client" }
tokio = { version = "1", features = ["test-util", "process"] }
libc = "0.2"

[build-dependencies]
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
newport-release = { path = "../newport-release", default-features = false }
sha2 = "0.11"
serde_json = "1"
