syntax = "proto3";

package newport.git;

import "newport/worker.proto";

// Runtime admission selects this service; configure binds its durable client identity.
enum Side {
  SIDE_UNSPECIFIED = 0;
  SIDE_HEAD_TO_INDEX = 1;
  SIDE_INDEX_TO_WORKTREE = 2;
  SIDE_HEAD_TO_WORKTREE = 3;
}

enum ResetMode {
  RESET_MODE_UNSPECIFIED = 0;
  RESET_MODE_SOFT = 1;
  RESET_MODE_MIXED = 2;
  RESET_MODE_HARD = 3;
}

enum DiscardSource {
  DISCARD_SOURCE_UNSPECIFIED = 0;
  DISCARD_SOURCE_INDEX = 1;
  DISCARD_SOURCE_HEAD = 2;
}

enum ConflictSide {
  CONFLICT_SIDE_UNSPECIFIED = 0;
  CONFLICT_SIDE_BASE = 1;
  CONFLICT_SIDE_OURS = 2;
  CONFLICT_SIDE_THEIRS = 3;
}

enum DiffLineEncoding {
  DIFF_LINE_ENCODING_UNSPECIFIED = 0;
  DIFF_LINE_ENCODING_TUPLE_V1 = 1;
}

enum OperationState {
  OPERATION_STATE_UNSPECIFIED = 0;
  OPERATION_STATE_RUNNING = 1;
  OPERATION_STATE_SUCCEEDED = 2;
  OPERATION_STATE_FAILED = 3;
  OPERATION_STATE_NEEDS_RESOLUTION = 4;
  OPERATION_STATE_OUTCOME_UNKNOWN = 5;
  OPERATION_STATE_REVIEWED_UNKNOWN = 6;
}

message Path { optional bytes data = 1; optional string display = 2; }

message StatusFilter {
  optional string text = 1;
  optional string group = 2;
}

message Author {
  optional string name = 1;
  optional string email = 2;
}

message TagAnnotation {
  optional string message = 1;
  optional Author author = 2;
}

message HunkSelection {
  repeated string ids = 1;
  optional StringList lines = 2;
  optional uint32 context_lines = 3;
}

message CommandLog {
  optional string command = 1;
  optional uint64 duration_ms = 2;
  optional sint32 exit_code = 3;
  optional string output = 4;
  optional bool interrupted = 5;
}

message ObjectId {
  optional string algorithm = 1;
  optional string hex = 2;
}

message TagObjectId {
  optional string format = 1;
  optional string hex = 2;
}

message Head {
  optional ObjectId oid = 1;
  optional Path name = 2;
  optional bool detached = 3;
  optional bool unborn = 4;
}

message IntegrationState {
  optional string kind = 1;
  optional bool managed = 2;
  optional bool can_continue = 3;
  optional bool can_abort = 4;
  optional bool can_skip = 5;
}

message RepositoryCapabilities {
  optional bool read_only = 1;
  optional bool working_tree = 2;
}

message Repository {
  optional string repo_id = 1;
  optional string common_repo_id = 2;
  optional Path root = 3;
  optional bool bare = 4;
  optional string object_format = 5;
  optional Head head = 6;
  optional string operation_state = 7;
  optional IntegrationState integration = 8;
  optional RepositoryCapabilities capabilities = 9;
}

message GroupCounts {
  optional uint64 staged = 1;
  optional uint64 unstaged = 2;
  optional uint64 untracked = 3;
  optional uint64 conflicted = 4;
}

message Upstream {
  optional Path remote = 1;
  optional Path reference = 2;
}

message StatusSummary {
  optional Head head = 1;
  optional string operation_state = 2;
  optional IntegrationState integration = 3;
  optional uint64 ahead = 4;
  optional uint64 behind = 5;
  optional string basis = 6;
  optional Path upstream_ref = 7;
  optional Upstream upstream = 8;
  optional bool truncated = 9;
  optional uint64 total_entries = 10;
  optional GroupCounts group_counts = 11;
  optional uint64 matched_entries = 12;
}

message ConflictEntry {
  optional uint32 mode = 1;
  optional ObjectId oid = 2;
  optional Path path = 3;
}

message Conflict {
  optional ConflictEntry base = 1;
  optional ConflictEntry ours = 2;
  optional ConflictEntry theirs = 3;
}

message StatusEntry {
  optional string entry_id = 1;
  optional Path path = 2;
  optional Path old_path = 3;
  optional uint32 flags = 4;
  optional bool staged = 5;
  optional bool unstaged = 6;
  optional bool untracked = 7;
  optional bool conflicted = 8;
  optional Conflict conflict = 9;
}

message ConfigurationEntry {
  optional Path value = 1;
  optional string level = 2;
  optional uint64 include_depth = 3;
}

message TrackingConfiguration {
  repeated ConfigurationEntry remote = 1;
  repeated ConfigurationEntry merge = 2;
}

message Tracking {
  optional string token = 1;
  optional bool editable = 2;
  optional TrackingConfiguration configuration = 3;
}

message Branch {
  optional Path name = 1;
  optional Path reference = 2;
  optional ObjectId oid = 3;
  optional bool remote = 4;
  optional bool current = 5;
  optional Path upstream = 6;
  optional Tracking tracking = 7;
}

message TotalEntries {
  optional uint64 total_entries = 1;
}

message Worktree {
  optional Path name = 1;
  optional string kind = 2;
  optional Path path = 3;
  optional Path git_dir = 4;
  optional bool current = 5;
  optional string state = 6;
  optional Head head = 7;
  optional bool locked = 8;
  optional Path lock_reason = 9;
  optional bool prunable = 10;
}

message WorktreeMetadata {
  optional string list_token = 1;
  optional uint64 total_entries = 2;
  optional uint64 matching_entries = 3;
  optional Worktree current = 4;
  optional Worktree main = 5;
}

message Remote {
  optional string name = 1;
  optional string url = 2;
  optional string push_url = 3;
  optional string token = 4;
}

message RemoteAuthentication {
  optional string ssh = 1;
  optional string https = 2;
}

message RepositoryConfiguration {
  optional bool fetch_prune = 1;
  optional string user_name = 2;
  optional string user_email = 3;
  optional string token = 4;
}

message Remotes {
  repeated Remote entries = 1;
  optional RemoteAuthentication authentication = 2;
  optional RepositoryConfiguration configuration = 3;
}

message RemoteName {
  optional string name = 1;
}

message RemoteReference {
  optional Path reference = 1;
  optional string kind = 2;
  optional ObjectId oid = 3;
  optional Path symbolic_target = 4;
}

message RemoteReferenceMetadata {
  optional string remote = 1;
  optional string remote_token = 2;
  optional bool for_push = 3;
  optional string basis = 4;
  optional bool truncated = 5;
  optional uint64 total_entries = 6;
}

message Blob {
  optional ObjectId oid = 1;
  optional uint64 size = 2;
  optional bytes bytes_b64 = 3;
  optional bool truncated = 4;
}

message BlobFragment {
  optional uint64 offset = 1;
  optional bytes bytes_b64 = 2;
}

message BlobMetadata {
  optional ObjectId oid = 1;
  optional uint64 size = 2;
}

message Stash {
  optional uint64 index = 1;
  optional string oid = 2;
  optional string previous_oid = 3;
  optional string message = 4;
  optional bool message_truncated = 5;
  optional sint64 time = 6;
}

message StashMetadata {
  optional string list_token = 1;
  optional uint64 total_entries = 2;
}

message Commit {
  optional ObjectId oid = 1;
  repeated ObjectId parents = 2;
  optional Path message = 3;
  optional bool message_truncated = 4;
  optional Author author = 5;
  optional sint64 time = 6;
  optional sint32 offset_minutes = 7;
}

message HistoryMetadata {
  optional ObjectId resolved_revision = 1;
  optional bool truncated = 2;
}

message Tagger {
  optional string name = 1;
  optional string email = 2;
  optional sint64 time = 3;
  optional sint32 offset_minutes = 4;
}

message Tag {
  optional Path name = 1;
  optional Path reference = 2;
  optional Path symbolic_target = 3;
  optional TagObjectId oid = 4;
  optional bool annotated = 5;
  optional bool details_omitted = 6;
  optional string object_type = 7;
  optional TagObjectId target_oid = 8;
  optional TagObjectId peeled_oid = 9;
  optional string peeled_type = 10;
  optional Path message = 11;
  optional bool message_truncated = 12;
  optional Tagger tagger = 13;
}

message Delta {
  optional Path old_path = 1;
  optional Path new_path = 2;
  optional ObjectId old_oid = 3;
  optional ObjectId new_oid = 4;
  optional uint32 old_mode = 5;
  optional uint32 new_mode = 6;
  optional string status = 7;
}

message DiffMetadata {
  optional bool read_only = 1;
  optional ObjectId commit_oid = 2;
  optional ObjectId parent_oid = 3;
  optional uint64 parent_index = 4;
  optional ObjectIdList parents = 5;
  optional string source_snapshot = 6;
  optional string entry_id = 7;
  optional Side side = 8;
  optional uint32 context_lines = 9;
  optional Path selected_path = 10;
  optional bool truncated = 11;
  optional uint64 total_files = 12;
  optional uint64 total_units = 13;
  optional bool has_omissions = 14;
}

message DiffLine {
  optional string id = 1;
  optional string origin = 2;
  optional uint64 old_line = 3;
  optional uint64 new_line = 4;
  optional Path content = 5;
}

message DiffHunk {
  optional string id = 1;
  optional uint64 old_start = 2;
  optional uint64 old_lines = 3;
  optional uint64 new_start = 4;
  optional uint64 new_lines = 5;
  repeated DiffLine lines = 6;
}

message DiffFile {
  optional Path old_path = 1;
  optional Path new_path = 2;
  optional ObjectId old_oid = 3;
  optional ObjectId new_oid = 4;
  optional uint32 old_mode = 5;
  optional uint32 new_mode = 6;
  optional string status = 7;
  optional bool binary = 8;
  optional uint64 additions = 9;
  optional uint64 deletions = 10;
  repeated DiffHunk hunks = 11;
}

message Diff {
  repeated DiffFile files = 1;
  optional bool read_only = 2;
  optional ObjectId commit_oid = 3;
  optional ObjectId parent_oid = 4;
  optional uint64 parent_index = 5;
  optional ObjectIdList parents = 6;
  optional string source_snapshot = 7;
  optional string entry_id = 8;
  optional Side side = 9;
  optional uint32 context_lines = 10;
  optional Path selected_path = 11;
  optional bool truncated = 12;
  optional uint64 total_files = 13;
  optional uint64 total_units = 14;
  optional bool has_omissions = 15;
}

message LineFragment {
  optional uint64 line_index = 1;
  optional uint64 byte_offset = 2;
  optional bool line_complete = 3;
  optional string origin = 4;
  optional uint64 old_line = 5;
  optional uint64 new_line = 6;
  optional bytes content_bytes_b64 = 7;
  optional string id = 8;
}

message HunkFragment {
  optional string id = 1;
  optional uint64 index = 2;
  optional uint64 old_start = 3;
  optional uint64 old_lines = 4;
  optional uint64 new_start = 5;
  optional uint64 new_lines = 6;
  optional uint64 total_lines = 7;
  repeated LineFragment lines = 8;
}

message FileFragment {
  optional Path old_path = 1;
  optional Path new_path = 2;
  optional ObjectId old_oid = 3;
  optional ObjectId new_oid = 4;
  optional uint32 old_mode = 5;
  optional uint32 new_mode = 6;
  optional string status = 7;
  optional bool binary = 8;
  optional uint64 additions = 9;
  optional uint64 deletions = 10;
  optional uint64 file_index = 11;
  optional string omission_reason = 12;
  repeated HunkFragment hunks = 13;
}

message Operation {
  optional string operation_id = 1;
  optional string repository = 2;
  optional string payload_hash = 3;
  optional OperationState state = 4;
  optional uint32 seq = 5;
  optional OperationResult result = 6;
  optional Failure error = 7;
}

message Closed {
  optional bool closed = 1;
}

message StreamComplete {
  optional uint32 last_seq = 1;
  optional uint64 bytes = 2;
}

message Refresh {
  optional bool refresh_required = 1;
}

message Committed {
  optional bool merge_completed = 1;
  optional string commit_oid = 2;
  optional string parent_oid = 3;
  optional bool refresh_required = 4;
}

message Amended {
  optional bool amended = 1;
  optional string replaced_oid = 2;
  optional string commit_oid = 3;
  optional bool refresh_required = 4;
}

message TrackingChanged {
  optional Tracking tracking = 1;
  optional string upstream = 2;
  optional bool refresh_required = 3;
}

message CheckedOut {
  optional bool detached = 1;
  optional string oid = 2;
  optional bool refresh_required = 3;
}

message RemoteRenamed {
  optional uint64 renamed_references = 1;
  optional string token = 2;
  optional bool refresh_required = 3;
}

message FastForwarded {
  optional bool fast_forwarded = 1;
  optional string oid = 2;
  optional bool refresh_required = 3;
}

message LeaseMatched {
  optional bool lease_matched = 1;
  optional bool refresh_required = 2;
}

message RemoteDeleted {
  optional bool deleted = 1;
  optional bool lease_matched = 2;
  optional string oid = 3;
  optional string destination_tag = 4;
  optional bool refresh_required = 5;
}

message TagCreated {
  optional string oid = 1;
  optional string target_oid = 2;
  optional bool refresh_required = 3;
}

message Reset {
  optional string previous_oid = 1;
  optional string oid = 2;
  optional bool refresh_required = 3;
}

message Discarded {
  optional bool index_changed = 1;
  optional bool refresh_required = 2;
}

message StashSaved {
  optional string oid = 1;
  optional bool saved = 2;
  optional bool refresh_required = 3;
}

message StashApplied {
  optional string oid = 1;
  optional bool applied = 2;
  optional bool dropped = 3;
  optional bool needs_resolution = 4;
  optional bool refresh_required = 5;
}

message StashDropped {
  optional string oid = 1;
  optional bool dropped = 2;
  optional bool refresh_required = 3;
}

message NeedsResolution {
  optional bool needs_resolution = 1;
  optional bool refresh_required = 2;
}

message IntegrationCompleted {
  optional bool needs_resolution = 1;
  optional bool aborted = 2;
  optional bool merge_completed = 3;
  optional string integration_completed = 4;
  optional string commit_oid = 5;
  optional string oid = 6;
  optional bool refresh_required = 7;
}

message WorktreeAdded {
  optional string name = 1;
  optional Path path = 2;
  optional bool open_required = 3;
  optional bool branch_created = 4;
  optional bool refresh_required = 5;
}

message WorktreeRepaired {
  optional bool changed = 1;
  optional bool refresh_required = 2;
}

message WorktreeRegistrationChanged {
  optional bool registration_only = 1;
  optional bool refresh_required = 2;
}

message Initialized {
  optional bool initialized = 1;
  optional Path path = 2;
  optional string initial_branch = 3;
  optional bool bare = 4;
  optional bool open_required = 5;
}

message Cloned {
  optional bool cloned = 1;
  optional Path path = 2;
  optional bool bare = 3;
  optional string oid = 4;
  optional bool open_required = 5;
}

message Configure {
  optional string id = 1;
  optional string client_id = 2;
  optional string client_version = 3;
  optional bool command_logs = 4;
}

message Limits {
  optional uint64 max_frame_bytes = 1;
  optional uint64 max_chunk_bytes = 2;
  optional uint32 max_inflight = 3;
  optional uint32 max_page_items = 4;
  optional uint32 stream_window = 5;
  optional bool command_logs = 6;
}

message Capabilities {
  repeated string methods = 1;
  repeated string object_formats = 2;
  repeated string features = 3;
  repeated string actions = 4;
}

message Ready {
  optional string id = 1;
