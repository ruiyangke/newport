syntax = "proto3";
package newport.desktop.events;
import "newport/git.proto";

message GitCommand {
  optional string server = 1;
  optional string repo_id = 2;
  optional string operation_id = 3;
  newport.git.CommandLog entry = 4;
}

message Event {
  oneof value {
    newport.desktop.events.GitCommand git_command = 1;
  }
}

message Batch {
  optional uint64 cursor = 1;
  repeated newport.desktop.events.Event entries = 2;
}

message PollArgs {
  optional uint64 after = 1;
}

message Operation {
  oneof value {
    newport.desktop.events.PollArgs poll = 1;
  }
}

message Reply {
  oneof value {
    newport.desktop.events.Batch poll = 1;
  }
}
