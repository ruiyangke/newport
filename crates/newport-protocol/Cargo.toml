[package]
name = "newport-protocol"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false
description = "Shared Newport contracts, validation and optional protobuf encoding"

[features]
default = []
compression = ["dep:flate2"]
protobuf = ["dep:prost", "dep:thiserror", "dep:heck", "dep:prost-build", "dep:prost-types", "dep:protox", "dep:sha2"]
tokio = ["protobuf", "dep:tokio"]
trace = ["protobuf", "dep:prost-reflect"]

[dependencies]
base64 = "0.23.1"
url = "2"
flate2 = { version = "1", default-features = false, features = ["rust_backend"], optional = true }
bytes = { version = "1.12.1", default-features = false, features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
serde_bytes = "0.11"
uuid = { version = "1", default-features = false, features = ["std"] }
prost = { version = "0.14.4", optional = true }
thiserror = { version = "2.0.21", optional = true }
tokio = { version = "1.53.3", default-features = false, features = ["io-util"], optional = true }
prost-reflect = { version = "0.16.5", features = ["serde"], optional = true }

[build-dependencies]
prost = { version = "0.14.4", optional = true }
sha2 = { version = "0.11", optional = true }
heck = { package = "heck", version = "0.5.0", optional = true }
prost-build = { package = "prost-build", version = "0.14.4", default-features = false, optional = true }
prost-types = { package = "prost-types", version = "0.14.4", optional = true }
protox = { package = "protox", version = "0.10.0", optional = true }

[dev-dependencies]
sha2 = "0.11"
newport-protocol = { path = ".", features = ["tokio", "trace"] }
prost-types = "0.14.4"
tokio = { version = "1.53.3", default-features = false, features = ["io-util", "macros", "rt"] }
