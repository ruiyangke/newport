[package]
name = "newport-gpui"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[dependencies]
newport-client = { path = "../newport-client" }
newport-protocol = { path = "../newport-protocol", features = ["protobuf"] }
newport-domain = { path = "../newport-domain" }
newport-platform = { path = "../newport-platform", features = ["pdf"] }
gpui-kit = { version = "=0.8.1", features = ["tree-sitter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
shlex = "2"
async-channel = "2"
futures-lite = "2"
futures = "0.3"
globset = "0.4"
anyhow = "1"
# Same version and features as gpui-kit's: the editor's LSP hooks take these types.
lsp-types = { version = "0.97.0", features = ["proposed"] }
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
base64 = "0.23.1"
regex = "1.13.1"
unicode-width = "0.2.2"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# The letter tile of an app with no icon, rendered as a PNG.
tiny-skia = "0.11.4"
ttf-parser = { version = "0.25.1", features = ["gvar-alloc"] }
newport-terminal = { path = "../newport-terminal" }
# gpui-kit's icons, built into debug builds as into release ones: otherwise a
# debug build reads them from this machine's source and shows none elsewhere.
rust-embed = { version = "8.13", features = ["debug-embed"] }

libloading = "0.8"
tree-sitter = "=0.26.13"
tree-sitter-language = "0.1"

[dev-dependencies]
newport-platform = { path = "../newport-platform" }
gpui-kit = { version = "=0.8.1", features = ["test-support"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2.7"
cocoa = "0.26"

[target.'cfg(any(target_os = "macos", windows))'.dependencies]
raw-window-handle = "0.6"
