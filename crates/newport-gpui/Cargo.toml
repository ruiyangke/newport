[package]
name = "newport-gpui"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
newport-client = { path = "../newport-client" }
newport-domain = { path = "../newport-domain" }
newport-platform = { path = "../newport-platform", features = ["pdf"] }
gpui-kit = { version = "=0.7.3", features = ["external-grammars"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
base64 = "0.23.1"
regex = "1.13.1"
unicode-width = "0.2.2"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
newport-terminal = { path = "../newport-terminal" }

libloading = "0.8"
tree-sitter = "=0.26.13"
tree-sitter-language = "0.1"

[dev-dependencies]
flate2 = "1"
newport-platform = { path = "../newport-platform" }
rmp-serde = "1.3"
gpui-kit = { version = "=0.7.3", features = ["test-support"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2.7"
cocoa = "0.26"

[target.'cfg(any(target_os = "macos", windows))'.dependencies]
raw-window-handle = "0.6"
