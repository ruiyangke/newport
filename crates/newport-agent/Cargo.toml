[package]
name = "newport-agent"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false
default-run = "newport-agent"
description = "Remote clipboard and browser agent for Newport"

[workspace]

[build-dependencies]
serde_json = "1"
semver = "1"

[[bin]]
name = "newport-agent"
path = "src/main.rs"

[[bench]]
name = "discovery_load"
path = "benches/discovery_load/main.rs"
harness = false

[dependencies]
bytes = { version = "1.12.1", default-features = false }
notify = "8.2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
sha2 = "0.11"
uuid = { version = "1", features = ["v4", "serde"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tar = "0.4"
url = "2"
getrandom = "0.3"
libc = "0.2"
ctrlc = { version = "3", features = ["termination"] }
# A held terminal's SIGTERM and SIGINT, as a byte its loop polls for.
signal-hook = { version = "0.4", default-features = false }
tempfile = "3"
fs2 = "0.4"
socket2 = "0.6"
wayland-server = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["server"] }
shlex = "2"
jsonc-parser = { version = "0.34", features = ["serde"] }
# The terminal engine the desktop renders with, so a holder's replica
# restores exactly what the tab would show.
newport-terminal = { path = "../../crates/newport-terminal" }
# The display environments the desktop validates the same way.
newport-protocol = { path = "../../crates/newport-protocol", features = ["protobuf", "compression"] }

[target.'cfg(target_os = "linux")'.dependencies]
netlink-packet-core = "0.9"
netlink-packet-sock-diag = { version = "0.5", default-features = false }
netlink-sys = { version = "0.9", default-features = false }
rustix = { version = "1.1", features = ["fs"] }

[dev-dependencies]
x11rb = "0.13"
wl-clipboard-rs = "0.9"
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client", "server"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
allocation-counter = "0.8.1"
socket2 = { version = "0.6", features = ["all"] }
arboard = { version = "3", default-features = false, features = ["image-data", "wayland-data-control"] }
image = { version = "0.25", default-features = false, features = ["png"] }

# Needle checksums its own executable as it starts. Unoptimized, hashing a
# debug build takes seconds on a busy runner, past Newport's deadlines.
[profile.dev.package.sha2]
opt-level = 3
